<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My To-Do List</title>
        
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
        
        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!-- Navigation bar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
        </div>
    </nav>
        
        <!-- Main content -->
        <div class="container mt-4">

            <h1 class="text-center mb-4">Task Manager</h1>
            <h2 class="text-center mb-4">Organize your tasks and stay productive</h2>

            <!-- Task input -->
            <div class="input-group mb-2">
                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="Enter a new task">

                <button
                    class="btn btn-primary"
                    id="addTaskBtn">
                    Add Task
                </button>
            </div>

            <!-- Error message -->
            <p id="errorMessage" class="text-danger"></p>

            <!-- Task counter -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0">Your tasks</h3>

            <span id="remainingCounter"
                    class="btn btn-primary">
                    0 remaining
                </span>
            </div>  

            <!-- Filter buttons -->
            <div class="mb-3">
                <button class="btn btn-outline-primary filter-btn" data-filter="all">
                    All
                </button>

                <button class="btn btn-outline-primary filter-btn" data-filter="active">
                    Active
                </button>

                <button class="btn btn-outline-primary filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <!-- Task list -->
            <ul id="taskList" class="list-group mb-3">
            </ul>

            <!-- Empty message -->
            <p id="emptyMessage" class="text-secondary text-center">
                No tasks yet. Add your first task!
            </p>

            <!-- Clear completed tasks -->
            <div class="text-start">
                <button id="clearCompletedBtn" class="btn btn-outline-danger">
                    Clear Completed
                </button>
            </div>
        </div>


        <!-- JavaScript -->
        <script src="script.js"></script>
    </body>
</html>
